# SIMPLE CONFIGURATION
# Defaults are used for every setting not shown. Change only your data and sensor values.

input:
  # ONE CAPTURE: provide one camera image and its matching LiDAR point cloud.
  image: data/image.png
  pointcloud: data/cloud.pcd

  # OR provide one ROS1 .bag / one ROS2 bag directory and the two topics.
  # bag: data/capture.bag
  # image_topic: /camera/image_raw
  # pointcloud_topic: /livox/lidar

camera:
  model: fisheye                 # fisheye or pinhole
  camera_matrix:                 # Replace with YOUR calibrated intrinsics.
    - [231.9893, 0.0, 241.5045]
    - [0.0, 231.9992, 181.2087]
    - [0.0, 0.0, 1.0]
  distortion: [0.002495, 0.587796, -1.888423, 2.264888]

checkerboard:
  inner_corners: [6, 9]          # columns, rows (not number of squares)
  square_size_mm: 41.0           # optional metadata; extrinsics use LiDAR metres

spherical_projection:
  horizontal_fov_deg: 90.0       # must include the full checkerboard
  vertical_fov_deg: 90.0
  forward_axis: [1, 0, 0]        # axes expressed in the point-cloud frame
  right_axis: [0, -1, 0]
  down_axis: [0, 0, -1]

# Advanced defaults are listed in README.md. Do not change unless diagnostics
# show that checkerboard extraction needs tuning.
